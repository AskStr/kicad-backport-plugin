name: Publish PCM update

on:
  push:
    tags: ['V*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example V0.4.7
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pcm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate tag and restore published history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pcm-repository
          gh release view --json tagName > dist/latest.json
          gh release list --limit 100 --json tagName,isDraft > dist/releases.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['TAG']
          version = json.loads(Path('plugin.json').read_text())['version']
          if not re.fullmatch(r'V[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'V' + version:
              raise SystemExit('Tag must match plugin.json version')
          latest = json.loads(Path('dist/latest.json').read_text())['tagName']
          key = lambda value: tuple(map(int, value.lstrip('Vv').split('.')))
          if key(latest) > key(tag):
              raise SystemExit('Refusing to publish an older tag as latest')
          exists = any(r['tagName'] == tag for r in json.loads(Path('dist/releases.json').read_text()))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('LATEST=' + latest + '\n')
              f.write('ARCHIVE=kicad-backport-v' + version + '-PCM.zip\n')
              f.write('RELEASE_EXISTS=' + str(exists).lower() + '\n')
          PY
      - name: Build once and prepare all PCM metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          # Fail closed: a download/authentication error must never erase history.
          gh release download "$LATEST" --pattern packages.json --pattern repository.json --dir dist/pcm-repository
          if [[ "$RELEASE_EXISTS" == true ]]; then
            # Never rebuild/replace an already-published version's ZIP.
            gh release download "$TAG" --pattern "$ARCHIVE" --dir dist
            python package_plugin.py --archive "dist/$ARCHIVE" --repository
          else
            python package_plugin.py --repository
          fi
          python -m unittest discover -s tests
      - name: Upload assets and publish only after they are complete
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EXISTS" != true ]]; then
            gh release create "$TAG" --draft --verify-tag --title "KiCad Backport $TAG" --notes 'KiCad 6–10.99 PCM release. Python 3.8+. Install and update through PCM; the existing repository subscription URL is unchanged.'
          fi
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          tag, repo = os.environ['TAG'], os.environ['GITHUB_REPOSITORY']
          root = Path('dist/pcm-repository')
          index = json.loads((root / 'repository.json').read_text())
          files = [Path('dist') / os.environ['ARCHIVE'], Path('dist/metadata.json'), Path('dist/icon.png')]
          files += [root / index[key]['url'].rsplit('/', 1)[1] for key in ('packages', 'resources')]
          files += [root / 'packages.json', root / 'repository.json']  # Root pointer LAST.
          release = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/releases/tags/' + tag]))
          assets = {a['name']: a for a in release['assets']}
          mutable = {'metadata.json', 'icon.png', 'packages.json', 'repository.json'}
          for path in files:
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              old = assets.get(path.name)
              if old and old.get('digest') == digest and old['size'] == path.stat().st_size:
                  continue
              if old and path.name not in mutable:
                  raise SystemExit('Refusing to overwrite immutable asset: ' + path.name)
              command = ['gh', 'release', 'upload', tag, str(path)]
              if old:
                  command.append('--clobber')
              subprocess.run(command, check=True)
          # Check server-side digests before publishing a new draft.
          release = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/releases/tags/' + tag]))
          assets = {a['name']: a for a in release['assets']}
          for path in files:
              assert assets[path.name]['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
          PY
          gh release edit "$TAG" --draft=false --latest
      - name: Verify anonymous PCM update downloads
        run: python scripts/pcm_repository_smoke.py --url "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/repository.json"
